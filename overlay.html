<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FACEIT overlay</title>
<style>
  html, body { margin:0; background:transparent; color:#e8eaed; font:600 18px/1.3 "Bahnschrift","Segoe UI",system-ui,sans-serif; }
  .card { display:inline-flex; align-items:center; gap:16px; margin:8px; padding:10px 18px 10px 14px; background:rgba(15,17,21,.84); border:1px solid #2a2e38; border-left:4px solid #ff5500; border-radius:12px; }
  .who b { display:block; font-size:22px; letter-spacing:.04em; } .who small { color:#8b93a1; font-weight:500; font-size:14px; }
  .stat { text-align:center; min-width:64px; } .stat b { display:block; font-size:22px; } .stat small { color:#8b93a1; font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .up { color:#3ecf8e; } .down { color:#ff5c5c; } .form { display:flex; gap:3px; } .form i { width:10px; height:22px; border-radius:3px; background:#3ecf8e; display:block; } .form i.l { background:#ff5c5c; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card" id="card" hidden>
  <div id="badge"></div>
  <div class="who"><b id="nick"></b><small id="elo"></small></div>
  <div class="stat"><b id="wl"></b><small>Today W–L</small></div>
  <div class="stat"><b id="kd"></b><small>K/D today</small></div>
  <div class="stat"><div class="form" id="form"></div><small>Last 5</small></div>
</div>
<div class="card" id="msg" hidden></div>

<script>
// OBS: Browser Source, адреса /overlay?u=НІК (необов'язково &every=60 для інтервалу оновлення в секундах), розмір ~ 560x110
const q = new URLSearchParams(location.search), nick = (q.get('u') || '').trim(), every = Math.max(30, +q.get('every') || 60);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LC = ['#9a9a9a', '#3ecf8e', '#3ecf8e', '#ffc400', '#ffc400', '#ffc400', '#ffc400', '#ff8a00', '#ff8a00', '#ff3b2f'];
const badge = l => `<svg width="46" height="46" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="${LC[l - 1]}" stroke-width="4"/><text x="20" y="${l === 10 ? 25 : 26}" text-anchor="middle" font-size="${l === 10 ? 14 : 17}" font-weight="700" fill="${LC[l - 1]}">${l}</text></svg>`;
const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };

function say(t) { $('card').hidden = true; $('msg').hidden = false; $('msg').textContent = t; }

function draw(j) {
  // ELO за сьогодні: від першого завантаження оверлею цього дня (FACEIT не віддає ELO по матчах автоматично)
  const key = 'ovbase:' + j.nickname.toLowerCase() + ':' + new Date().toDateString();
  let base = null;
  try { base = +localStorage.getItem(key) || null; if (!base && j.elo) { localStorage.setItem(key, j.elo); base = +j.elo; } } catch (e) {}
  const d = base && j.elo ? j.elo - base : 0, lv = Math.min(10, Math.max(1, +j.level || 1));
  $('badge').innerHTML = badge(lv);
  $('nick').textContent = j.nickname;
  $('elo').innerHTML = (j.elo || '–') + ' ELO' + (j.elo ? ` · <span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d} today</span>` : '');
  $('wl').textContent = j.wins + '–' + j.losses;
  $('kd').textContent = j.kd == null ? '–' : j.kd.toFixed(2);
  $('form').innerHTML = j.last5.slice().reverse().map(w => `<i class="${w ? '' : 'l'}"></i>`).join('');
  $('msg').hidden = true; $('card').hidden = false;
}

async function tick() {
  if (!nick) { say('Add ?u=YourNickname to the URL'); return; }
  try {
    const r = await fetch('/api/overlay?nick=' + encodeURIComponent(nick) + '&since=' + dayStart()), j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Request failed');
    draw(j);
  } catch (e) { if ($('card').hidden) say(e.message); }   // якщо вже є дані, лишаємо останні
}
tick(); setInterval(tick, every * 1000);
</script>
</body>
</html>
