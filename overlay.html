<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FACEIT overlay</title>
<style>
  html, body { margin:0; background:transparent; color:#e8eaed; font:600 16px/1.2 "Bahnschrift","Segoe UI",system-ui,sans-serif; }
  .ov { max-width:520px; margin:8px; padding:10px 12px 12px; box-sizing:border-box; overflow:hidden; background:rgba(13,15,20,.9); border:1px solid #27324a; border-radius:12px; box-shadow:0 0 0 1px rgba(255,85,0,.12) inset; }
  .top { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand { display:flex; align-items:center; gap:6px; flex:0 0 auto; font-size:17px; letter-spacing:.08em; text-transform:uppercase; } .brand svg { width:20px; height:20px; color:#ff5500; } .brand b { color:#ff5500; } .brand span { color:#e8eaed; }
  .tag { padding:2px 10px; border-radius:999px; background:#1b2233; border:1px solid #2c3956; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#aab4c8; }
  .pills { margin-left:auto; display:flex; gap:5px; flex:0 1 auto; min-width:0; }
  .pill { flex:0 1 auto; min-width:0; padding:5px 6px; white-space:nowrap; text-align:center; border-radius:7px; font-size:14px; background:rgba(255,92,92,.22); border:1px solid #ff5c5c; color:#ff8d8d; }
  .pill.w { background:rgba(62,207,142,.2); border-color:#3ecf8e; color:#7be3b5; }
  .mid { display:flex; align-items:flex-end; justify-content:space-between; margin:8px 0 10px; }
  .rank { display:flex; align-items:center; gap:8px; font-size:15px; color:#aab4c8; } .rank i { font-style:normal; text-transform:uppercase; font-size:11px; padding:1px 6px; border:1px solid #2c3956; border-radius:4px; }
  .nick { font-size:26px; margin:2px 0 4px; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .elo { display:flex; align-items:center; gap:10px; } .elo b { font-size:34px; color:#ff6a1a; letter-spacing:.02em; } .elo em { font-style:normal; font-size:22px; }
  .side { display:flex; flex-direction:column; align-items:flex-end; gap:8px; padding-bottom:4px; }
  .lbl { font-size:12px; letter-spacing:.14em; color:#7b8499; text-transform:uppercase; }
  .stats { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .st { background:#141926; border:1px solid #232c42; border-radius:8px; padding:6px 4px 7px; text-align:center; } .st small { display:block; color:#7b8499; font-size:11px; letter-spacing:.08em; text-transform:uppercase; } .st b { font-size:18px; }
  .up { color:#3ecf8e; } .down { color:#ff5c5c; }
  .msg { display:inline-block; margin:8px; padding:8px 14px; border-radius:10px; background:rgba(13,15,20,.9); border:1px solid #27324a; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="ov" id="ov" hidden>
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><path d="M16 1v8M16 23v8M1 16h8M23 16h8"/></svg><b>FACEIT</b><span>Stats</span></div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="mid">
    <div>
      <div class="rank" id="rank"></div>
      <div class="nick" id="nick"></div>
      <div class="elo"><span id="badge"></span><b id="eloval"></b><em id="delta"></em></div>
    </div>
    <div class="side"><span class="tag" id="today"></span><div class="lbl" id="lbl"></div></div>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div class="msg" id="msg" hidden></div>

<script>
// OBS: Browser Source, адреса /overlay?u=НІК (необов'язково &every=60: інтервал оновлення, с). Розмір ~ 520x170
const q = new URLSearchParams(location.search), nick = (q.get('u') || '').trim(), every = Math.max(30, +q.get('every') || 60);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LC = ['#9a9a9a', '#3ecf8e', '#3ecf8e', '#ffc400', '#ffc400', '#ffc400', '#ffc400', '#ff8a00', '#ff8a00', '#ff3b2f'];
const badge = l => `<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="${LC[l - 1]}" stroke-width="4"/><text x="20" y="${l === 10 ? 25 : 26}" text-anchor="middle" font-size="${l === 10 ? 14 : 17}" font-weight="700" fill="${LC[l - 1]}">${l}</text></svg>`;
const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const num = (v, d = 2) => v == null ? '–' : (+v).toFixed(d);

function say(t) { $('ov').hidden = true; $('msg').hidden = false; $('msg').textContent = t; }

function draw(j) {
  // ELO за сьогодні: від першого завантаження оверлею цього дня (FACEIT не віддає ELO по матчах автоматично)
  const key = 'ovbase:' + j.nickname.toLowerCase() + ':' + new Date().toDateString();
  let base = null;
  try { base = +localStorage.getItem(key) || null; if (!base && j.elo) { localStorage.setItem(key, j.elo); base = +j.elo; } } catch (e) {}
  const d = base && j.elo ? j.elo - base : 0, lv = Math.min(10, Math.max(1, +j.level || 1)), s = j.stats, r = j.rank || {};
  $('today').textContent = 'Today ' + j.wins + '–' + j.losses;
  $('pills').innerHTML = j.last5.slice().reverse().map(m => `<div class="pill ${m.win ? 'w' : ''}" title="${m.win ? 'WIN' : 'LOSS'}">${m.k}/${m.d}</div>`).join('');
  const pos = r.country ? `#${r.country}${r.countryCode ? ' <i>' + esc(r.countryCode) + '</i>' : ''}` : r.region ? `#${r.region} <i>${esc(r.regionName || '')}</i>` : '';
  $('rank').innerHTML = pos;
  $('nick').textContent = j.nickname;
  $('badge').innerHTML = badge(lv);
  $('eloval').textContent = j.elo ? (+j.elo).toLocaleString('en') : '–';
  $('delta').innerHTML = j.elo ? `<span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d}</span>` : '';
  $('lbl').textContent = s ? 'Last ' + s.n + ' matches' : '';
  $('stats').innerHTML = s ? [['K/D', num(s.kd)], ['K/R', num(s.krr)], ['ADR', num(s.adr, 1)], ['AVG', num(s.avg, 1)], ['HS%', s.hs == null ? '–' : s.hs + '%'], ['WIN%', s.wr + '%']]
    .map(([l, v]) => `<div class="st"><small>${l}</small><b>${v}</b></div>`).join('') : '';
  $('msg').hidden = true; $('ov').hidden = false;
}

async function tick() {
  if (!nick) { say('Add ?u=YourNickname to the URL'); return; }
  try {
    const r = await fetch('/api/overlay?nick=' + encodeURIComponent(nick) + '&since=' + dayStart()), j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Request failed');
    draw(j);
  } catch (e) { if ($('ov').hidden) say(e.message); }   // якщо вже є дані, лишаємо останні
}
if (typeof document !== 'undefined' && document.getElementById('ov')) { tick(); setInterval(tick, every * 1000); }
</script>
</body>
</html>
