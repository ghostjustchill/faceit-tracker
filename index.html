<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACEIT Stats</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --text:#e8eaed; --muted:#8b93a1; --accent:#ff5500; --win:#3ecf8e; --loss:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 20px; font-size:26px; } h1 span { color:var(--accent); }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input, select, button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  input { flex:1 1 320px; } button { background:var(--accent); border-color:var(--accent); font-weight:600; cursor:pointer; }
  button.ghost { background:var(--card); border-color:var(--line); font-weight:400; }
  #msg { min-height:24px; color:var(--muted); margin-bottom:8px; } #msg.err { color:var(--loss); }
  .head { display:flex; align-items:center; gap:14px; margin:16px 0; }
  .head img { width:56px; height:56px; border-radius:50%; background:var(--card); }
  .head h2 { margin:0; font-size:22px; } .head p { margin:0; color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card b { display:block; font-size:22px; } .card small { color:var(--muted); }
  h3 { margin:24px 0 8px; font-size:16px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  .win { color:var(--win); } .loss { color:var(--loss); }
  .bar { display:inline-block; height:8px; border-radius:4px; background:var(--accent); vertical-align:middle; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1><span>FACEIT</span> Stats</h1>

  <form id="form">
    <input id="link" placeholder="https://www.faceit.com/en/players/Nickname" autocomplete="off" required>
    <select id="range">
      <option value="20">Last 20</option>
      <option value="50">Last 50</option>
      <option value="100">Last 100</option>
      <option value="0" selected>All matches</option>
    </select>
    <button type="submit">Show stats</button>
  </form>
  <div id="msg"></div>

  <section id="result" hidden>
    <div class="head"><img id="avatar" alt=""><div><h2 id="nick"></h2><p id="sub"></p></div></div>
    <div class="cards" id="cards"></div>

    <h3>By map</h3>
    <div class="scroll"><table id="maps"></table></div>

    <h3>Recent matches</h3>
    <div class="scroll"><table id="recent"></table></div>

    <p><button class="ghost" id="csv" type="button">Download CSV</button></p>
  </section>
</main>

<script>
let data = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kd = (k, d) => (d ? k / d : k).toFixed(2);

function setMsg(text, isErr) { $('msg').textContent = text; $('msg').className = isErr ? 'err' : ''; }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  setMsg('Loading matches, this can take a few seconds…');
  $('result').hidden = true;
  try {
    const r = await fetch('/api/stats?link=' + encodeURIComponent($('link').value));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Request failed');
    data = j;
    setMsg('');
    render();
  } catch (err) {
    setMsg(err.message, true);
  }
});
$('range').addEventListener('change', () => data && render());

function render() {
  const all = data.matches;
  const n = +$('range').value || all.length;
  const ms = all.slice(0, n);              // від найновішого
  if (!ms.length) { setMsg('No matches found.', true); return; }

  const sum = k => ms.reduce((a, m) => a + m[k], 0);
  const kills = sum('kills'), deaths = sum('deaths'), assists = sum('assists');
  const wins = ms.filter(m => m.win).length;
  const best = ms.reduce((a, m) => m.kills > a.kills ? m : a, ms[0]);

  $('avatar').src = data.avatar || '';
  $('avatar').hidden = !data.avatar;
  $('nick').textContent = data.nickname;
  $('sub').textContent = [data.level ? 'Level ' + data.level : '', data.elo ? data.elo + ' ELO' : '', ms.length + ' of ' + all.length + ' matches shown'].filter(Boolean).join(' · ');

  const cards = [
    ['Matches', ms.length], ['Win rate', (100 * wins / ms.length).toFixed(1) + '%'],
    ['K/D', kd(kills, deaths)], ['Avg kills', (kills / ms.length).toFixed(2)],
    ['Kills', kills], ['Deaths', deaths], ['Assists', assists],
    ['Best match', best.kills + ' kills'],
  ];
  $('cards').innerHTML = cards.map(([l, v]) => `<div class="card"><b>${esc(v)}</b><small>${l}</small></div>`).join('');

  const by = {};
  for (const m of ms) {
    const s = by[m.map || '(unknown)'] ||= { played: 0, wins: 0, kills: 0, deaths: 0 };
    s.played++; s.wins += m.win; s.kills += m.kills; s.deaths += m.deaths;
  }
  const rows = Object.entries(by).sort((a, b) => b[1].played - a[1].played);
  const maxPlayed = rows[0][1].played;
  $('maps').innerHTML = '<tr><th>Map</th><th>Matches</th><th></th><th>Win rate</th><th>K/D</th></tr>' + rows.map(([name, s]) =>
    `<tr><td>${esc(name)}</td><td>${s.played}</td><td><span class="bar" style="width:${Math.round(80 * s.played / maxPlayed)}px"></span></td>` +
    `<td>${(100 * s.wins / s.played).toFixed(1)}%</td><td>${kd(s.kills, s.deaths)}</td></tr>`).join('');

  $('recent').innerHTML = '<tr><th>Map</th><th>Result</th><th>K</th><th>D</th><th>A</th></tr>' + ms.slice(0, 20).map(m =>
    `<tr><td>${esc(m.map)}</td><td class="${m.win ? 'win' : 'loss'}">${m.win ? 'WIN' : 'LOSS'}</td><td>${m.kills}</td><td>${m.deaths}</td><td>${m.assists}</td></tr>`).join('');

  $('result').hidden = false;
}

$('csv').addEventListener('click', () => {
  const n = +$('range').value || data.matches.length;
  const lines = ['number,map,result,kills,deaths,assists'].concat(
    data.matches.slice(0, n).map((m, i) => [i + 1, m.map, m.win ? 'win' : 'loss', m.kills, m.deaths, m.assists].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = data.nickname + '_matches.csv';
  a.click();
});
</script>
</body>
</html>
