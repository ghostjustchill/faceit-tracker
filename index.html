<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACEIT Stats</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --text:#e8eaed; --muted:#8b93a1; --accent:#ff5500; --win:#3ecf8e; --loss:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 20px; font-size:26px; } h1 span { color:var(--accent); }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input, select, button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  input { flex:1 1 280px; } button { background:var(--accent); border-color:var(--accent); font-weight:600; cursor:pointer; }
  .chk { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; }
  input[type=checkbox] { flex:none; width:auto; padding:0; accent-color:var(--accent); }
  button:disabled { opacity:.6; cursor:wait; } button.ghost { background:var(--card); border-color:var(--line); font-weight:400; }
  #msg { min-height:24px; color:var(--muted); margin-bottom:8px; } #msg.err { color:var(--loss); }
  .head { display:flex; align-items:center; gap:14px; margin:16px 0; }
  .head img { width:56px; height:56px; border-radius:50%; background:var(--card); }
  .head h2 { margin:0; font-size:22px; } .head p { margin:0; color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card b { display:block; font-size:22px; } .card small { color:var(--muted); }
  h3 { margin:24px 0 8px; font-size:16px; } .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; } .win, td.best { color:var(--win); font-weight:600; } .loss { color:var(--loss); }
  .bar { display:inline-block; height:8px; border-radius:4px; background:var(--accent); vertical-align:middle; }
  svg.chart { width:100%; height:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .pt { fill:transparent; } .pt:hover { fill:var(--accent); }
  .legend { color:var(--muted); font-size:13px; margin:6px 0 0; }

  /* ---- Counter-Strike style: tactical grid, T/CT glow, radar side panels ---- */
  body { background:
      radial-gradient(900px 520px at 0% 0%, rgba(255,85,0,.20), transparent 60%),
      radial-gradient(900px 520px at 100% 100%, rgba(70,150,255,.18), transparent 60%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/40px 40px,
      var(--bg);
    background-attachment: fixed; font-family: "Bahnschrift","Segoe UI",system-ui,sans-serif; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px); }
  main { position:relative; z-index:1; }
  h1 { display:flex; align-items:center; gap:12px; letter-spacing:.12em; text-transform:uppercase; }
  h1 svg { width:34px; height:34px; color:var(--accent); flex:none; }
  h2, h3, th { letter-spacing:.06em; text-transform:uppercase; }
  h3 { font-size:14px; color:var(--muted); border-left:3px solid var(--accent); padding-left:10px; }
  .card { border-left:3px solid var(--accent); background:rgba(26,29,36,.88); transition:border-color .15s, transform .15s; }
  .card:hover { border-color:#4a9bff; transform:translateY(-2px); }
  .card b { font-variant-numeric:tabular-nums; }
  button, select, input { backdrop-filter:blur(2px); }
  button { text-transform:uppercase; letter-spacing:.08em; }
  tr:hover td { background:rgba(255,255,255,.03); }
  svg.chart { background:rgba(26,29,36,.88); }
  .side { position:fixed; top:50%; transform:translateY(-50%); width:140px; height:300px; opacity:.55;
    pointer-events:none; display:none; z-index:0; }
  .side.l { left:10px; color:#ff7a33; } .side.r { right:10px; color:#4a9bff; }
  @media (min-width:1180px) { .side { display:block; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<svg class="side l" viewBox="0 0 140 300" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
  <circle cx="70" cy="70" r="60"/><circle cx="70" cy="70" r="40"/><circle cx="70" cy="70" r="20"/>
  <path d="M70 6v128M6 70h128"/><path d="M70 70L118 38" stroke-width="2.5"/><circle cx="96" cy="52" r="3.5" fill="currentColor"/>
  <path d="M10 170h120M10 188h84M10 206h104M10 224h58" opacity=".6"/>
  <path d="M10 246h120v34H10z"/><text x="70" y="268" text-anchor="middle" fill="currentColor" stroke="none" font-size="13" letter-spacing="3">T SIDE</text>
</svg>
<svg class="side r" viewBox="0 0 140 300" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
  <circle cx="70" cy="70" r="60"/><circle cx="70" cy="70" r="40"/><circle cx="70" cy="70" r="20"/>
  <path d="M70 6v128M6 70h128"/><path d="M70 70L118 38" stroke-width="2.5"/><circle cx="96" cy="52" r="3.5" fill="currentColor"/>
  <path d="M10 170h120M10 188h84M10 206h104M10 224h58" opacity=".6"/>
  <path d="M10 246h120v34H10z"/><text x="70" y="268" text-anchor="middle" fill="currentColor" stroke="none" font-size="13" letter-spacing="3">CT SIDE</text>
</svg>
<main>
  <h1><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="16" cy="16" r="9"/><path d="M16 1v8M16 23v8M1 16h8M23 16h8"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/></svg><span>FACEIT</span> Stats</h1>
  <form id="form">
    <input id="a" placeholder="Nickname or profile link" autocomplete="off" required>
    <input id="b" placeholder="Compare with (nickname or link, optional)" autocomplete="off">
    <select id="range">
      <option value="20">Last 20</option><option value="50">Last 50</option>
      <option value="100">Last 100</option><option value="0" selected>All matches</option>
    </select>
    <label class="chk"><input type="checkbox" id="comp"> Competitive maps only</label>
    <button id="go" type="submit">Show stats</button>
  </form>
  <div id="msg"></div>
  <section id="out" hidden></section>
</main>

<script>
let D = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = x => x == null ? '–' : x.toFixed(2);
const f1 = x => x == null ? '–' : x.toFixed(1);
const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };

function st(ms) {
  const n = ms.length, sum = k => ms.reduce((a, m) => a + m[k], 0);
  const kills = sum('kills'), deaths = sum('deaths'), wins = ms.filter(m => m.win).length;
  const avg = k => { const v = ms.filter(m => m[k] > 0); return v.length ? v.reduce((a, m) => a + m[k], 0) / v.length : null; };
  return { n, wins, wr: 100 * wins / n, kills, deaths, assists: sum('assists'),
           kd: deaths ? kills / deaths : kills, avg: kills / n, adr: avg('adr'), hs: avg('hs') };
}

async function load(link) {
  const r = await fetch('/api/stats?link=' + encodeURIComponent(link));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const links = [$('a').value.trim(), $('b').value.trim()].filter(Boolean);
  $('go').disabled = true; $('out').hidden = true;
  msg('Loading matches, this can take a few seconds…');
  try { D = await Promise.all(links.map(load)); msg(''); render(); }
  catch (err) { msg(err.message, true); }
  $('go').disabled = false;
});
$('range').addEventListener('change', () => D.length && render());
$('comp').addEventListener('change', () => D.length && render());

function slice(p) {
  const all = $('comp').checked ? p.matches.filter(m => /^de_/.test(m.map)) : p.matches;   // тільки змагальні мапи
  const n = +$('range').value || all.length;
  return all.slice(0, n);
}

function chart(ms, shared) {
  const pts = ms.slice(0, 100).reverse();          // від старішого до новішого
  if (pts.length < 3) return '';
  const W = 800, H = 200, L = 36, R = 12, T = 16, B = 28;
  const max = shared || Math.max(10, ...pts.map(m => m.kills));
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => H - B - v / max * (H - T - B);
  const day = m => m.finished ? new Date(m.finished).toLocaleDateString() : '';
  const grid = [0, .5, 1].map(f => { const v = Math.round(max * f);
    return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" fill="var(--muted)" font-size="11" text-anchor="end">${v}</text>`; }).join('');
  const raw = pts.map((m, i) => x(i) + ',' + y(m.kills)).join(' ');
  const ma = pts.map((_, i) => { const w = pts.slice(Math.max(0, i - 9), i + 1); return x(i) + ',' + y(w.reduce((a, m) => a + m.kills, 0) / w.length); }).join(' ');
  const dots = pts.map((m, i) => `<circle class="pt" cx="${x(i)}" cy="${y(m.kills)}" r="6"><title>${esc([day(m), m.map, m.kills + '/' + m.deaths + '/' + m.assists + ' K/D/A', m.win ? 'WIN' : 'LOSS'].filter(Boolean).join(' · '))}</title></circle>`).join('');
  return `<h3>Form: kills per match (last ${pts.length})</h3>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kills per match chart">${grid}
    <polyline points="${raw}" fill="none" stroke="var(--muted)" stroke-width="1" opacity=".6"/>
    <polyline points="${ma}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>${dots}
    <text x="${L}" y="${H - 8}" fill="var(--muted)" font-size="11">${esc(day(pts[0]))}</text>
    <text x="${W - R}" y="${H - 8}" fill="var(--muted)" font-size="11" text-anchor="end">${esc(day(pts[pts.length - 1]))}</text>
  </svg><p class="legend">Grey: each match · Orange: average of last 10 · Hover a point for details</p>`;
}

const peak = p => Math.max(10, ...slice(p).slice(0, 100).map(m => m.kills));

function maps(ms) {
  const by = {};
  for (const m of ms) { const s = by[m.map || '(unknown)'] ||= { p: 0, w: 0, k: 0, d: 0 }; s.p++; s.w += m.win; s.k += m.kills; s.d += m.deaths; }
  const rows = Object.entries(by).sort((a, b) => b[1].p - a[1].p), top = rows[0][1].p;
  return '<h3>By map</h3><div class="scroll"><table><tr><th>Map</th><th>Matches</th><th></th><th>Win rate</th><th>K/D</th></tr>' +
    rows.map(([n, s]) => `<tr><td>${esc(n)}</td><td>${s.p}</td><td><span class="bar" style="width:${Math.round(80 * s.p / top)}px"></span></td><td>${f1(100 * s.w / s.p)}%</td><td>${f2(s.d ? s.k / s.d : s.k)}</td></tr>`).join('') + '</table></div>';
}

// FACEIT не віддає історію ELO по матчах, тому запам'ятовуємо ELO в цьому браузері при кожному перегляді
function trackElo(p) {
  if (!p.elo) return '';
  const key = 'elo:' + p.nickname.toLowerCase();
  let h = [];
  try { h = JSON.parse(localStorage.getItem(key)) || []; } catch (e) {}
  if (!h.length || h[h.length - 1].e !== p.elo) {
    h.push({ e: p.elo, d: Date.now() });
    try { localStorage.setItem(key, JSON.stringify(h.slice(-200))); } catch (e) {}
  }
  if (h.length < 2) return '';
  const diff = p.elo - h[0].e;
  return ' · ' + (diff >= 0 ? '+' : '') + diff + ' ELO since ' + new Date(h[0].d).toLocaleDateString();
}

function head(p, shown) {
  return `<div class="head">${p.avatar ? `<img src="${esc(p.avatar)}" alt="">` : ''}<div><h2>${esc(p.nickname)}</h2><p>` +
    [p.level ? 'Level ' + p.level : '', p.elo ? p.elo + ' ELO' : '', shown + ' of ' + p.matches.length + ' matches'].filter(Boolean).join(' · ') + trackElo(p) + '</p></div></div>';
}

function render() {
  if (D.some(p => !slice(p).length)) return msg('No matches found with these filters.', true);
  msg('');
  $('out').innerHTML = D.length === 1 ? single(D[0]) : compare(D[0], D[1]);
  $('out').hidden = false;
  const c = $('csv'); if (c) c.onclick = () => csv(D[0]);
}

function single(p) {
  const ms = slice(p), s = st(ms), best = Math.max(...ms.map(m => m.kills));
  const cards = [['Matches', s.n], ['Win rate', f1(s.wr) + '%'], ['K/D', f2(s.kd)], ['Avg kills', f2(s.avg)],
    ...(s.adr != null ? [['ADR', f1(s.adr)]] : []), ...(s.hs != null ? [['Headshot %', f1(s.hs) + '%']] : []),
    ['Kills', s.kills], ['Deaths', s.deaths], ['Assists', s.assists], ['Best match', best + ' kills']];
  const recent = '<h3>Recent matches</h3><div class="scroll"><table><tr><th>Map</th><th>Result</th><th>K</th><th>D</th><th>A</th></tr>' +
    ms.slice(0, 20).map(m => `<tr><td>${esc(m.map)}</td><td class="${m.win ? 'win' : 'loss'}">${m.win ? 'WIN' : 'LOSS'}</td><td>${m.kills}</td><td>${m.deaths}</td><td>${m.assists}</td></tr>`).join('') + '</table></div>';
  return head(p, ms.length) + `<div class="cards">${cards.map(([l, v]) => `<div class="card"><b>${esc(v)}</b><small>${l}</small></div>`).join('')}</div>` +
    chart(ms) + maps(ms) + recent + '<p><button class="ghost" id="csv" type="button">Download CSV</button></p>';
}

function compare(p, q) {
  const A = st(slice(p)), B = st(slice(q)), shared = Math.max(peak(p), peak(q));
  const rows = [['Matches', 'n', 0, x => x], ['Win rate', 'wr', 1, x => f1(x) + '%'], ['K/D', 'kd', 1, f2], ['Avg kills', 'avg', 1, f2],
    ['ADR', 'adr', 1, f1], ['Headshot %', 'hs', 1, x => f1(x) + '%'], ['Kills', 'kills', 0, x => x], ['Deaths', 'deaths', 0, x => x], ['Assists', 'assists', 0, x => x]]
    .filter(([, k]) => A[k] != null || B[k] != null);
  const cell = (v, other, rank, fmt) => `<td class="${rank && v != null && other != null && v > other ? 'best' : ''}">${v == null ? '–' : fmt(v)}</td>`;
  return `<div class="cards" style="grid-template-columns:1fr 1fr">${[p, q].map(x => head(x, slice(x).length)).join('')}</div>
    <div class="scroll"><table><tr><th></th><th>${esc(p.nickname)}</th><th>${esc(q.nickname)}</th></tr>` +
    rows.map(([l, k, rank, fmt]) => `<tr><td>${l}</td>${cell(A[k], B[k], rank, fmt)}${cell(B[k], A[k], rank, fmt)}</tr>`).join('') + '</table></div>' +
    `<h3>${esc(p.nickname)}</h3>${chart(slice(p), shared)}<h3>${esc(q.nickname)}</h3>${chart(slice(q), shared)}<p class="legend">Both charts use the same scale.</p>`;
}

function csv(p) {
  const lines = ['number,map,result,kills,deaths,assists,adr,hs_percent'].concat(
    slice(p).map((m, i) => [i + 1, m.map, m.win ? 'win' : 'loss', m.kills, m.deaths, m.assists, m.adr, m.hs].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = p.nickname + '_matches.csv'; a.click();
}
</script>
</body>
</html>
