<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACEIT Stats</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --text:#e8eaed; --muted:#8b93a1; --accent:#ff5500; --win:#3ecf8e; --loss:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 20px; font-size:26px; } h1 span { color:var(--accent); }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input, select, button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  input { flex:1 1 280px; } button { background:var(--accent); border-color:var(--accent); font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; } button.ghost { background:var(--card); border-color:var(--line); font-weight:400; }
  #msg { min-height:24px; color:var(--muted); margin-bottom:8px; } #msg.err { color:var(--loss); }
  .head { display:flex; align-items:center; gap:14px; margin:16px 0; }
  .head img { width:56px; height:56px; border-radius:50%; background:var(--card); }
  .head h2 { margin:0; font-size:22px; } .head p { margin:0; color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card b { display:block; font-size:22px; } .card small { color:var(--muted); }
  h3 { margin:24px 0 8px; font-size:16px; } .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; } .win, td.best { color:var(--win); font-weight:600; } .loss { color:var(--loss); }
  .bar { display:inline-block; height:8px; border-radius:4px; background:var(--accent); vertical-align:middle; }
  svg.chart { width:100%; height:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .legend { color:var(--muted); font-size:13px; margin:6px 0 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1><span>FACEIT</span> Stats</h1>
  <form id="form">
    <input id="a" placeholder="https://www.faceit.com/en/players/Nickname" autocomplete="off" required>
    <input id="b" placeholder="Compare with (optional second link)" autocomplete="off">
    <select id="range">
      <option value="20">Last 20</option><option value="50">Last 50</option>
      <option value="100">Last 100</option><option value="0" selected>All matches</option>
    </select>
    <button id="go" type="submit">Show stats</button>
  </form>
  <div id="msg"></div>
  <section id="out" hidden></section>
</main>

<script>
let D = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = x => x == null ? '–' : x.toFixed(2);
const f1 = x => x == null ? '–' : x.toFixed(1);
const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };

function st(ms) {
  const n = ms.length, sum = k => ms.reduce((a, m) => a + m[k], 0);
  const kills = sum('kills'), deaths = sum('deaths'), wins = ms.filter(m => m.win).length;
  const avg = k => { const v = ms.filter(m => m[k] > 0); return v.length ? v.reduce((a, m) => a + m[k], 0) / v.length : null; };
  return { n, wins, wr: 100 * wins / n, kills, deaths, assists: sum('assists'),
           kd: deaths ? kills / deaths : kills, avg: kills / n, adr: avg('adr'), hs: avg('hs') };
}

async function load(link) {
  const r = await fetch('/api/stats?link=' + encodeURIComponent(link));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const links = [$('a').value.trim(), $('b').value.trim()].filter(Boolean);
  $('go').disabled = true; $('out').hidden = true;
  msg('Loading matches, this can take a few seconds…');
  try { D = await Promise.all(links.map(load)); msg(''); render(); }
  catch (err) { msg(err.message, true); }
  $('go').disabled = false;
});
$('range').addEventListener('change', () => D.length && render());

function slice(p) { const n = +$('range').value || p.matches.length; return p.matches.slice(0, n); }

function chart(ms) {
  const pts = ms.slice(0, 100).reverse();          // від старішого до новішого
  if (pts.length < 3) return '';
  const W = 800, H = 180, P = 24, max = Math.max(10, ...pts.map(m => m.kills));
  const x = i => P + i * (W - 2 * P) / (pts.length - 1), y = v => H - P - v / max * (H - 2 * P);
  const raw = pts.map((m, i) => x(i) + ',' + y(m.kills)).join(' ');
  const ma = pts.map((_, i) => { const w = pts.slice(Math.max(0, i - 9), i + 1); return x(i) + ',' + y(w.reduce((a, m) => a + m.kills, 0) / w.length); }).join(' ');
  return `<h3>Form: kills per match (last ${pts.length})</h3>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kills per match chart">
    <polyline points="${raw}" fill="none" stroke="var(--muted)" stroke-width="1" opacity=".6"/>
    <polyline points="${ma}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
    <text x="${P}" y="14" fill="var(--muted)" font-size="11">max ${max}</text>
  </svg><p class="legend">Grey: each match · Orange: average of last 10 matches</p>`;
}

function maps(ms) {
  const by = {};
  for (const m of ms) { const s = by[m.map || '(unknown)'] ||= { p: 0, w: 0, k: 0, d: 0 }; s.p++; s.w += m.win; s.k += m.kills; s.d += m.deaths; }
  const rows = Object.entries(by).sort((a, b) => b[1].p - a[1].p), top = rows[0][1].p;
  return '<h3>By map</h3><div class="scroll"><table><tr><th>Map</th><th>Matches</th><th></th><th>Win rate</th><th>K/D</th></tr>' +
    rows.map(([n, s]) => `<tr><td>${esc(n)}</td><td>${s.p}</td><td><span class="bar" style="width:${Math.round(80 * s.p / top)}px"></span></td><td>${f1(100 * s.w / s.p)}%</td><td>${f2(s.d ? s.k / s.d : s.k)}</td></tr>`).join('') + '</table></div>';
}

function head(p, shown) {
  return `<div class="head">${p.avatar ? `<img src="${esc(p.avatar)}" alt="">` : ''}<div><h2>${esc(p.nickname)}</h2><p>` +
    [p.level ? 'Level ' + p.level : '', p.elo ? p.elo + ' ELO' : '', shown + ' of ' + p.matches.length + ' matches'].filter(Boolean).join(' · ') + '</p></div></div>';
}

function render() {
  if (D.some(p => !p.matches.length)) return msg('No matches found.', true);
  $('out').innerHTML = D.length === 1 ? single(D[0]) : compare(D[0], D[1]);
  $('out').hidden = false;
  const c = $('csv'); if (c) c.onclick = () => csv(D[0]);
}

function single(p) {
  const ms = slice(p), s = st(ms), best = Math.max(...ms.map(m => m.kills));
  const cards = [['Matches', s.n], ['Win rate', f1(s.wr) + '%'], ['K/D', f2(s.kd)], ['Avg kills', f2(s.avg)],
    ...(s.adr != null ? [['ADR', f1(s.adr)]] : []), ...(s.hs != null ? [['Headshot %', f1(s.hs) + '%']] : []),
    ['Kills', s.kills], ['Deaths', s.deaths], ['Assists', s.assists], ['Best match', best + ' kills']];
  const recent = '<h3>Recent matches</h3><div class="scroll"><table><tr><th>Map</th><th>Result</th><th>K</th><th>D</th><th>A</th></tr>' +
    ms.slice(0, 20).map(m => `<tr><td>${esc(m.map)}</td><td class="${m.win ? 'win' : 'loss'}">${m.win ? 'WIN' : 'LOSS'}</td><td>${m.kills}</td><td>${m.deaths}</td><td>${m.assists}</td></tr>`).join('') + '</table></div>';
  return head(p, ms.length) + `<div class="cards">${cards.map(([l, v]) => `<div class="card"><b>${esc(v)}</b><small>${l}</small></div>`).join('')}</div>` +
    chart(ms) + maps(ms) + recent + '<p><button class="ghost" id="csv" type="button">Download CSV</button></p>';
}

function compare(p, q) {
  const A = st(slice(p)), B = st(slice(q));
  const rows = [['Matches', 'n', 0, x => x], ['Win rate', 'wr', 1, x => f1(x) + '%'], ['K/D', 'kd', 1, f2], ['Avg kills', 'avg', 1, f2],
    ['ADR', 'adr', 1, f1], ['Headshot %', 'hs', 1, x => f1(x) + '%'], ['Kills', 'kills', 0, x => x], ['Deaths', 'deaths', 0, x => x], ['Assists', 'assists', 0, x => x]]
    .filter(([, k]) => A[k] != null || B[k] != null);
  const cell = (v, other, rank, fmt) => `<td class="${rank && v != null && other != null && v > other ? 'best' : ''}">${v == null ? '–' : fmt(v)}</td>`;
  return `<div class="cards" style="grid-template-columns:1fr 1fr">${[p, q].map(x => head(x, slice(x).length)).join('')}</div>
    <div class="scroll"><table><tr><th></th><th>${esc(p.nickname)}</th><th>${esc(q.nickname)}</th></tr>` +
    rows.map(([l, k, rank, fmt]) => `<tr><td>${l}</td>${cell(A[k], B[k], rank, fmt)}${cell(B[k], A[k], rank, fmt)}</tr>`).join('') + '</table></div>' +
    `<h3>${esc(p.nickname)}</h3>${chart(slice(p))}<h3>${esc(q.nickname)}</h3>${chart(slice(q))}`;
}

function csv(p) {
  const lines = ['number,map,result,kills,deaths,assists,adr,hs_percent'].concat(
    slice(p).map((m, i) => [i + 1, m.map, m.win ? 'win' : 'loss', m.kills, m.deaths, m.assists, m.adr, m.hs].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = p.nickname + '_matches.csv'; a.click();
}
</script>
</body>
</html>
